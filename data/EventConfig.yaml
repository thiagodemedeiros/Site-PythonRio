    speakerName: "Ágata de Lima"
    speakerPhotoUrl: https://i.imgur.com/ZCnx0wi.png
    talkTitle: 'Do PDF ao dado estruturado'
    talkDescription: |
      Quase toda empresa tem informação importante presa em PDFs, planilhas e documentos Word, e alguém copiando e colando tudo à mão. Nesta palestra, vou mostrar como construir em Python um pipeline que recebe esses arquivos e entrega dados estruturados e validados, usando um LLM como ""interpretador"".

      Vamos passar pelas etapas reais do processo: extrair o texto de cada formato, lidar com o limite de contexto, pedir ao modelo uma saída em formato definido, validar com Pydantic e tratar os erros que aparecem na prática. O foco é compartilhar o que aprendi construindo isso em um projeto real, incluindo o que deu errado, para que quem assistir saia com um caminho claro para fazer o mesmo.
