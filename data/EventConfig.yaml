    instagramUrl: ""
    speakerName: "Luciano Ratamero"
    speakerPhotoUrl: https://i.imgur.com/CpHQyrB.jpeg
    talkTitle: 'Frontends modernos com django-vite'
    talkDescription: |
      Uma das partes mais criticadas do Django é sua parte de frontend, vista como defasada, ou pouco flexível. Para resolver isso, em geral os times acabam usando um frontend separado, em outro projeto/repositório, deixando o Django apenas como API; mas isso é custoso, e cria não só retrabalho, como burocracia na gestão de tarefas.
      
      Essa paletra mostrará como usar o django-vite, que é uma biblioteca que traz a facilidade de se utilizar qualquer framework ou biblioteca de frontend diretamente em um projeto Django.
  - id: 3
