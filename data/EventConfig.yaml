    speakerName: "Roberto Araujo"
    speakerPhotoUrl: https://i.imgur.com/IgN0Ffp.jpeg
    talkTitle: 'WebMCP: ensinando a Web a conversar com agentes de IA'
    talkDescription: |
      E se os sites pudessem conversar diretamente com agentes de IA?

      O WebMCP traz uma nova forma de conectar a Web à inteligência artificial, permitindo que aplicações exponham suas próprias funcionalidades como ferramentas que agentes podem descobrir e executar. Nesta palestra, vamos entender como isso funciona, por que pode mudar a forma como agentes interagem com a Web e, claro, ver tudo acontecendo em uma **demo ao vivo**.
