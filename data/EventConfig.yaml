    talkTitle: 'Relatividade Geral e Python'
    talkDescription: |
      No meio acadêmico, é notável a dependência de softwares proprietários e licenças pagas em áreas que exigem cálculos computacionais robustos. Esta palestra vem mostrar como podemos utilizar o Python e todo o seu ecossistema como uma alternativa gratuita e acessível, focando na experiência prática de aplicação no estudo da Relatividade Geral.
