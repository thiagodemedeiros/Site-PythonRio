    speakerName: "Carolina Bratos"
    speakerPhotoUrl: https://i.imgur.com/ziQUBkM.png
    talkTitle: 'Desmistificando o "eu não sirvo pra codar"'
    talkDescription: |
      Como uma profissional formada em Processos Gerenciais, que não sabia o que era front ou back-end, conseguiu se destacar entre 21.000 inscritos, gabaritar provas de lógica e conquistar uma vaga efetiva de desenvolvimento em meio à gestação?

      Nesta palestra inspiradora, vou compartilhar os bastidores da minha transição radical de carreira de 10 anos atuando em diversas áreas de administração para a Engenharia de Software, o choque com a síndrome da impostora e como a bagagem prévia em gestão e raciocínio lógico se tornou a chave para romper no mundo da tecnologia. Mais do que uma história de superação, é um convite realista e encorajador para que mais pessoas — especialmente mulheres e mães — acreditem que a tecnologia também é o seu lugar. Venha ouvir sobre resiliência, disciplina e como transformar desafios em código e carreira.
